[project]
name = "iur-ade-generator"
version = "0.1.0"
description = "Code generators and verification harness for the i-UR ADE extension of citygml4j and the 3D City Database Importer/Exporter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "kei-w" }]
keywords = ["CityGML", "PLATEAU", "i-UR", "ADE", "3DCityDB", "citygml4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "jinja2>=3.1.6",
]

[project.urls]
Repository = "https://github.com/kei-w/iur-ade-generator"

[project.scripts]
iur-ade = "iur_ade_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iur_ade_generator"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# the generators format their Java, SQL and XML templates with %: no f-strings forced
ignore = ["UP031"]
[tool.ruff.lint.per-file-ignores]
# the templates of the generated Java, SQL and XML are longer than the code lines
"src/iur_ade_generator/citygml4j/*.py" = ["E501"]
"src/iur_ade_generator/citydb/*.py" = ["E501"]
"src/iur_ade_generator/mapping/*.py" = ["E501"]
"src/iur_ade_generator/fixture.py" = ["E501"]
"src/iur_ade_generator/binding.py" = ["E501"]
"src/iur_ade_generator/changes.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the forks, the JAXB classes, ade-xjc, the Importer/Exporter or a database (run with -m integration)",
]
addopts = "-m 'not integration'"
